<head> 
    <meta name="viewport" >
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title style="background-color: red;">Teksti-format</title>
</head>

<body>
    teksti-formati <br>     <!--لاضافه linebreak يعني سطر جديد-->
    this is <b>bold</b> text   <br>     <!--طمس الكلمه الي بين ال b -->
    this is  <i>italic</i> text <br>    <!--نص مائل-->
    this is <sub>subscript</sub> txt <br>   <!--نص سفلي -->
    this is <sup>superscript</sup> text <br> <!--نص علوي-->
    this is <small>small text</small> <br> <!--نص صغيز-->
    this is <big>big</big> text <br>  <!--نص كبير-->
    this is <ins>inserted </ins> text <br>  <!--نص مسطر-->
    this is <del>deleted </del> text <br>   <!--نص مشطوب-->
    this is <mark>marked</mark> text  <br> <!--نص مميز-->
    this is <strong>strong</strong> text <br> <!--متل ال bold-->
    this is <hr>vaakaviiva</hr> text   <br>

</body>
