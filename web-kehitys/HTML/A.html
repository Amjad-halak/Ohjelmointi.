<!-- ========================================= -->
<!--        الشرح والملاحظات الأساسية          -->
<!-- ========================================= -->
<!-- <h1-h6>  : تستخدم للعناوين (Titles) -->
<!-- <p>       : تستخدم للفقرات والنصوص (Paragraphs) -->
<!-- <a>       : تستخدم للروابط (Links) -->
<!-- <meta>    : ضبط إعدادات التشفير والخطوط للغة (مثل UTF-8) -->
<!-- <link>    : ربط ملف التنسيقات والألوان الخارجي CSS بالصفحة -->
<!-- <script>  : ربط ملف الأكواد والتفاعلات البرمجية JS بالصفحة -->
<!-- ملاحظة   : جميع الوسوم السابقة لها وسم إغلاق يُضاف له slash مثل: <a></a> باستثناء وسوم سريعة مثل <meta> و <link> و <br> -->
<!-- HTML     : هي الهيكل والأساس كأنك تبني البناء من الصفر -->
<!-- CSS      : هي الفرش والديكور (الألوان، التصاميم، الزخارف) -->
<!-- اختصار   : Cmd + Shift + / (لإضافة تعليق) -->

<!DOCTYPE html>                                                         <!-- إقرار بأن المستند بترميز HTML5 (يُكتب دائماً في أول سطر) -->
<html lang="fi">                                                        <!-- الوسم الرئيسي للصفحة كاملة وتحديد لغة الصفحة (الفنلندية) -->

    <head>                                                              <!-- رأس الصفحة (يحتوي المعلومات الخفية وإعدادات الصفحة) -->

        <meta charset="UTF-8">                                          <!-- ضبط ترميز الحروف العالمي لإظهار أحرف مثل (ä, ö) والعربية بشكل صحيح -->
        
        <link rel="stylesheet" href="styles.css">                       <!-- ربط ملف CSS: (rel="stylesheet" ثابتة دائماً)، و (href="اسم_ملف_الـCSS.css") -->
        
        <script src="script.js"></script>                               <!-- ربط ملف JavaScript: (src="اسم_ملف_الـJS.js") (غير مطلوب في Tehtävä 1) -->
        
        <title>amjad.com</title>                                        <!-- عنوان الصفحة الذي يظهر في أعلى المتصفح (Tab) -->
        
    </head>                                                             <!-- إغلاق رأس الصفحة -->

    <body>                                                              <!-- جسم الصفحة (يحتوي كل ما يراه المستخدم داخل الموقع) -->

        <!-- العناوين -->
        <h1>عنوان h1</h1>
        <h2>عنوان h2</h2>
        <h3>عنوان h3</h3>
        <h4>عنوان h4</h4>

        <!-- نص مع تنسيق المسافات والأسطر (pre) -->
        <pre>
النصوص الداخلية شو ما بدك فيك تحط
اذا كانت p ف مافيك تعدل علي النص داخليا
بس ال pre فيك تعدل برياحتك مثلا اضافه مسافات
سطر جديد الخ الخ
        </pre>

        <br>                                                            <!-- سطر فارغ بين النصين -->
        <hr>                                                            <!-- خط عريض فاصل -->

        <p>  نص بس مافيك تعدل عليه متل ال pre </p>

    </body>                                                             <!-- إغلاق جسم الصفحة -->

</html>                                                                 <!-- إغلاق ملف الـ HTML بالكامل -->
