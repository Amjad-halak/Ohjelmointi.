<body>
  <h1>Example</h1>
  <form id="form">
    <label >First name:
    <input id="first-name" name="firstName" type="text"/></label>
    <label >Last name:
    <input id="last-name" name="lastName" type="text"/></label>
    <label >Greeting:
    <select id="greeting">
      <option value="Hello">Hello</option>
      <option value="Good morning">Good morning</option>
      <option value="Nice to meet you">Nice to meet you</option>
    </select></label>
    <button type="submit">Submit</button>
  </form>
  <p id="result"></p>
</body>
</html>
